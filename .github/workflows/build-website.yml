name: Build Website

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Build website every day at 4:00 UTC
  schedule:
    - cron: "0 4 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCHIVE: xmpp-org-master.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Python packages
        run: uv sync --locked

      - name: Software list linting
        run: uv run xmpp_org lint_software_list

      - name: Build XEP list
        run: uv run xmpp_org build_xep_list

      - name: Build RFC list
        run: uv run xmpp_org build_rfc_list

      - name: Build software list
        run: uv run xmpp_org build_software_list

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"

      - name: Build website
        run: hugo

      - name: Create build archive
        run: tar -czf ${{ env.ARCHIVE }} "./public"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: xmpp.org-master
          path: ${{ env.ARCHIVE }}
